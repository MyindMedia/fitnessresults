<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Personal training built around you. 20+ years serving the Inland Empire. Safe, Effective, Efficient coaching in Montclair. No contracts. Book a consultation." />
  <meta name="keywords"
    content="fitness, gym, personal training, group classes, Montclair CA, workout, strength training" />

  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Fitness Results | Personal Training in Montclair, CA" />
  <meta property="og:description"
    content="Feel stronger with personalized, science-informed coaching in Montclair. No contracts, no pressure. Book a consultation with Fitness Results." />
  <meta property="og:image" content="/og-image.jpg" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <title>Fitness Results | Personal Training in Montclair, CA</title>
</head>

<body>
  <!-- Static definitions let Netlify detect the React inquiry forms at deploy time. -->
  <form name="consultation" method="POST" data-netlify="true" hidden>
    <input name="form-name" value="consultation" />
    <input name="name" /><input name="email" /><input name="phone" />
    <input name="date" /><input name="time" /><input name="trainer" /><textarea name="message"></textarea>
  </form>
  <form name="contact" method="POST" data-netlify="true" hidden>
    <input name="form-name" value="contact" />
    <input name="name" /><input name="email" /><input name="phone" />
    <input name="subject" /><textarea name="message"></textarea>
  </form>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
